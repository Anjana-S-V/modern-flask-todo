<!DOCTYPE html>
<html>
<head>
    <title>Modern To-Do App</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <div class="card shadow-lg p-4 bg-secondary">

        <h2 class="text-center mb-4">📝 Modern To-Do List</h2>

        <!-- Add Task Form -->
        <form method="POST" class="d-flex mb-3">
            <input type="text" name="task" class="form-control me-2"
                   placeholder="Enter a new task..." required>
            <button type="submit" class="btn btn-success">Add</button>
        </form>

        <!-- Task List -->
        <ul class="list-group">
            {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between align-items-center
                {% if task.completed %} list-group-item-success {% endif %}">

                <span class="{% if task.completed %} text-decoration-line-through {% endif %}">
                    {{ task.content }}
                </span>

                <div>
                    <a href="/complete/{{ task.id }}" class="btn btn-sm btn-warning me-2">
                        {% if task.completed %} Undo {% else %} Complete {% endif %}
                    </a>

                    <a href="/delete/{{ task.id }}" class="btn btn-sm btn-danger">
                        Delete
                    </a>
                </div>
            </li>
            {% endfor %}
        </ul>

    </div>
</div>

</body>
</html>
